name: "Unit Tests"

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The harness. Normally `main` rather than a pinned SHA so a harness fix does not require
  # a commit here; the trade-off is that an unrelated harness regression can turn this red,
  # which the job log makes obvious because the failure is in the reference's own code.
  # TEMPORARY -- REVERT BEFORE MERGE (restore fprime-community/fprime-samd-reference @ main).
  # fprime-samd-reference main pins a lib/fprime without nasa/fprime#6237 (Drv.AsyncGuardedSpi),
  # which this PR's SpiDriver implements; until fprime-samd-reference#9 lands, build against
  # that PR's branch so the harness carries the interface.
  HARNESS_REPO: lestarch-autobot/fprime-samd-reference
  # 05ecee7 = the SPI-only re-cut of fprime-samd-reference#9 (lib/fprime = Kronos3 upstream +
  # nasa/fprime devel 64e4426 incl. #6237, AsyncSpiCfg), on the autobot fork branch
  # devin/1791242679-fram-driver; pinned by SHA so the harness cannot change under this PR.
  HARNESS_REF: 05ecee7e2f8fde10877cc2ca8248074b7f4efa10

jobs:
  native-ut:
    name: "Native unit tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Enforces the TEMPORARY marker above: a push to main with the harness still pointed
      # away from fprime-community/fprime-samd-reference fails here instead of passing.
      - name: Refuse a temporary harness pointer on main
        if: github.event_name == 'push' && env.HARNESS_REPO != 'fprime-community/fprime-samd-reference'
        run: |
          echo "::error::HARNESS_REPO=${HARNESS_REPO} is a temporary pointer; restore fprime-community/fprime-samd-reference@main before merging"
          exit 1
      - name: "Checkout the harness"
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HARNESS_REPO }}
          ref: ${{ env.HARNESS_REF }}
          filter: blob:none

      - name: "Initialise the harness's other submodules"
        shell: bash
        run: |
          git submodule update --init --recursive --filter=blob:none \
            lib/fprime lib/fprime-baremetal

      - name: "Check this commit out as lib/fprime-samd"
        uses: actions/checkout@v5
        with:
          path: lib/fprime-samd
          filter: blob:none

      - name: "Report what is being tested"
        shell: bash
        run: |
          echo "harness  ${HARNESS_REPO}@$(git rev-parse HEAD)"
          echo "library  ${GITHUB_REPOSITORY}@$(git -C lib/fprime-samd rev-parse HEAD)"

      - name: "Set up F Prime"
        uses: ./lib/fprime-samd/.github/actions/setup-fprime

      - name: "Generate the native unit-test build cache"
        run: fprime-util generate --ut

      - name: "Build and run this library's unit tests"
        uses: ./lib/fprime-samd/.github/actions/unit-tests
        with:
          preset: native-ut
          include: "^fprime-samd_"

      - name: "Build the native-ut all target"
        run: ninja -C build-fprime-automatic-native-ut all

      - name: "Install gcovr"
        shell: bash
        run: pip install gcovr

      - name: "Coverage: StaticTlmPacketizer / StaticCmdDispatcher via the harness's CmdTlmTest topology"
        uses: ./lib/fprime-samd/.github/actions/attach-coverage
        with:
          module: CmdTlmTest/Top
          attach: |
            lib/fprime-samd/fprime-samd/Svc/StaticTlmPacketizer
            lib/fprime-samd/fprime-samd/Svc/StaticCmdDispatcher
          summary-title: "StaticTlmPacketizer / StaticCmdDispatcher coverage (via CmdTlmTest)"
